[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scrcpy-menu"
version = "2.0.0"
description = "Cross-platform Control Center and CLI for scrcpy and ADB (Linux, Windows, macOS)"
readme = "README.md"
authors = [
    { name = "ijlaal1610", email = "ijlaalakhtar@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "PySide6>=6.5.0; extra == 'gui'",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5.0"]

[project.scripts]
scrcpy-menu = "scrcpy_menu.__main__:main"
scrcpy-ctl = "scrcpy_menu.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scrcpy_menu*"]
