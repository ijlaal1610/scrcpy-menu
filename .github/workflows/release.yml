name: Build Standalone Executables (Multi-Platform)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish compiled binaries directly to GitHub Releases?'
        required: true
        type: boolean
        default: false
      tag_name:
        description: 'Release Tag (used if publishing release)'
        required: false
        type: string
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset_name: scrcpy-control-center-linux-x86_64
            executable_path: dist/scrcpy-control-center
          - os: ubuntu-24.04-arm
            asset_name: scrcpy-control-center-linux-aarch64
            executable_path: dist/scrcpy-control-center
          - os: windows-latest
            asset_name: scrcpy-control-center-windows-x64.exe
            executable_path: dist/scrcpy-control-center.exe
          - os: macos-14
            asset_name: scrcpy-control-center-macos-arm64
            executable_path: dist/scrcpy-control-center
          - os: macos-15-intel
            asset_name: scrcpy-control-center-macos-x86_64
            executable_path: dist/scrcpy-control-center

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller
          pip install -e .

      - name: Build Standalone Binary with PyInstaller
        run: |
          python build_standalone.py

      - name: Rename Output Binary
        shell: bash
        run: |
          mv "${{ matrix.executable_path }}" "dist/${{ matrix.asset_name }}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish_release == 'true'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "Scrcpy Control Center ${{ github.event.inputs.tag_name || github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
